[package]
name = "cosmic-orbit"
version = "0.1.1"
edition = "2024"
license = "GPL-3.0-only"
description = "Orbit: a control panel applet for COSMIC — quick toggles, sliders, calendar and media in one popup"

[dependencies]
jiff = "0.2"
libc = "0.2"
cosmic-settings-a11y-manager-subscription = { git = "https://github.com/pop-os/cosmic-settings", rev = "f1d00fc" }
cosmic-settings-accessibility-subscription = { git = "https://github.com/pop-os/cosmic-settings", rev = "f1d00fc" }
futures = "0.3"
i18n-embed = { version = "0.16", features = ["fluent-system", "desktop-requester"] }
icu = { version = "2", features = ["compiled_data"] }
rust-embed = "8"
# Cover art: the JPEG, PNG and WebP decoders libcosmic leaves out.
iced = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = ["image-without-codecs"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libcosmic = { git = "https://github.com/pop-os/libcosmic", default-features = false, features = [
    "applet",
    "dbus-config",
    "multi-window",
    "tokio",
    "wayland",
    "winit",
] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
url = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", default-features = false, features = ["tokio", "p2p"] }

[dev-dependencies]
unic-langid = "0.9"

[profile.release]
opt-level = 3
panic = "abort"
lto = "thin"

# Same pins as cosmic-applets 1.11, to match the installed panel and its theme format.
[patch."https://github.com/smithay/client-toolkit.git"]
sctk = { package = "smithay-client-toolkit", version = "0.20.0" }

[patch."https://github.com/pop-os/cosmic-protocols"]
cosmic-protocols = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "c0cff4d" }
cosmic-client-toolkit = { git = "https://github.com/pop-os/cosmic-protocols//", rev = "c0cff4d" }
